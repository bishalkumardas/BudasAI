<aside class="ticker" aria-label="Market ticker"><div class="ticker-viewport"><div class="ticker-track"><div class="ticker-set">{% for m in get_markets()[:5] %}<a href="/markets/{{ m.slug }}">{{ m.name }} <strong>{% if m.current_value is not none %}{{ '{:,.2f}'.format(m.current_value) }}{% else %}—{% endif %}</strong>{% if m.change_percent is not none %} <b class="{{ 'positive' if m.change_percent >= 0 else 'negative' }}">{{ '+' if m.change_percent >= 0 else '' }}{{ '{:.2f}'.format(m.change_percent) }}%</b>{% endif %}</a>{% endfor %}</div></div></div></aside>
