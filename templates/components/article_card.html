<article class="article-card"><a class="article-cover" href="/research/{{article.slug}}"><img src="{{article.image}}" alt="Abstract visual for {{article.category}} research" loading="lazy"></a><div class="article-card-content"><div class="eyebrow">{{article.category}} {% if article.featured %}<span>Featured</span>{% endif %}</div><h3><a href="/research/{{article.slug}}">{{article.title}}</a></h3><p>{{article.excerpt}}</p><footer>{{article.published_at|format_display_date}} &middot; {{article.reading_time}}</footer></div></article>
